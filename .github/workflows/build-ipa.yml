name: Build iOS IPA (Sideloadly / TrollStore)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Xcode Project with XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          xcodebuild clean build \
            -project IAPHunter.xcodeproj \
            -scheme IAPHunter \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Compile & Embed In-App StoreKit Scanner Tweak (IAPHunterTweak.dylib)
        run: |
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -framework UIKit -framework StoreKit -framework Foundation \
            -install_name @executable_path/Frameworks/IAPHunterTweak.dylib \
            Tweak/IAPHunterTweak.m -o IAPHunterTweak.dylib

          mkdir -p build/Build/Products/Release-iphoneos/IAPHunter.app/Frameworks
          cp IAPHunterTweak.dylib build/Build/Products/Release-iphoneos/IAPHunter.app/Frameworks/

      - name: Package Pre-Embedded .ipa Files (All-in-One, Gemini, Google One, CapCut)
        run: |
          # 1. Standard All-in-One IPA
          rm -rf Payload
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/IAPHunter.app Payload/
          zip -r9 IAPHunter-Unsigned.ipa Payload

          # 2. Google Gemini Pre-Bound StoreKit IPA (com.google.gemini)
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.google.gemini" Payload/IAPHunter.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Gemini IAP" Payload/IAPHunter.app/Info.plist || true
          zip -r9 IAPHunter-Gemini.ipa Payload

          # 3. Google One Pre-Bound StoreKit IPA (com.google.GoogleOne)
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.google.GoogleOne" Payload/IAPHunter.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName G-One IAP" Payload/IAPHunter.app/Info.plist || true
          zip -r9 IAPHunter-GoogleOne.ipa Payload

          # 4. CapCut Pre-Bound StoreKit IPA (com.lemon.lvoverseas)
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.lemon.lvoverseas" Payload/IAPHunter.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName CapCut IAP" Payload/IAPHunter.app/Info.plist || true
          zip -r9 IAPHunter-CapCut.ipa Payload

      - name: Upload Pre-Embedded IPAs & Tweak Dylib
        uses: actions/upload-artifact@v4
        with:
          name: IAPHunter-IPA
          path: |
            IAPHunter-Unsigned.ipa
            IAPHunter-Gemini.ipa
            IAPHunter-GoogleOne.ipa
            IAPHunter-CapCut.ipa
            IAPHunterTweak.dylib
          if-no-files-found: error
